model_list:
  - model_name: qwen3-8b
    litellm_params:
      model: openai/mlx-community/Qwen3-8B-4bit
      api_base: http://host.docker.internal:8100/v1
      api_key: not-needed
    model_info:
      max_input_tokens: 28672 # VLLM_CONTEXT(32768) - VLLM_MAX_TOKENS(4096)

  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      additional_drop_params: ["litellm_proxy"]

  - model_name: gemini-3.1-flash-lite
    litellm_params:
      model: gemini/gemini-3.1-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      additional_drop_params: ["litellm_proxy"]

router_settings:
  enable_pre_call_checks: true

litellm_settings:
  drop_params: true
  num_retries: 0 # 동일 모델 재시도 없이 에러/타임아웃 시 바로 fallback으로 전환
  # context_window_fallbacks 가 없으면 ContextWindowExceededError 도 일반 fallbacks 로 처리돼 qwen3-8b 초과 요청이 gemini 로 넘어감
  # qwen3-8b 항목 없이 다른 모델만 지정해 두면 qwen3-8b 의 컨텍스트 초과는 fallback 없이 에러로 반환됨
  context_window_fallbacks:
    - gemini-3.5-flash-lite: ["gemini-3.1-flash-lite"]
  fallbacks:
    - gemini-3.5-flash-lite: ["gemini-3.1-flash-lite"] # 503(과부하)/타임아웃 시 자동 전환
    - qwen3-8b: ["gemini-3.5-flash-lite"] # vllm-mlx 장애 시 자동 전환
